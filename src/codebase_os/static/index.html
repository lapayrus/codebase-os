<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CodebaseOS</title>
  <style>body{font:16px system-ui;margin:0;background:#101217;color:#e9edf5}main{max-width:960px;margin:0 auto;padding:48px 24px}h1{font-size:42px;margin:0 0 8px}p{color:#a8b0c0}.bar{display:flex;align-items:end;gap:10px;margin:28px 0}.bar label{position:absolute;clip:rect(0 0 0 0);height:1px;width:1px;overflow:hidden}input{flex:1;padding:15px;border-radius:8px;border:1px solid #3a4353;background:#191d26;color:white;font-size:16px}button{min-height:48px;padding:0 20px;border:0;border-radius:8px;background:#78a9ff;color:#07101f;font-weight:700}.card{background:#191d26;border:1px solid #30394a;border-radius:10px;padding:20px;margin-top:16px}.claim{margin:12px 0}.ev{font:13px ui-monospace;color:#a8b0c0;background:#11141b;padding:12px;border-radius:6px;white-space:pre-wrap}.tag{color:#78a9ff;font-size:12px}summary{cursor:pointer}@media(max-width:480px){main{padding:32px 16px}h1{font-size:34px}.bar{align-items:stretch;flex-direction:column}button{padding:12px}}</style>
</head>
<body><main><h1>CodebaseOS</h1><p>Ask your repository. Get an answer you can verify.</p><div class="bar"><label for="q">Question</label><input id="q" placeholder="Where does authentication create a session?"><button type="button">Ask</button></div><div id="out" aria-live="polite"></div></main><script src="/static/app.js"></script></body>
</html>
