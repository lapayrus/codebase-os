name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.29"
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q
      - run: uv run python -m compileall -q src
      - run: uv build
