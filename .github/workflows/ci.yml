name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CODEBASEOS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codebaseos
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codebaseos
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.29"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q
      - run: uv run python -m compileall -q src
      - run: uv build
